[project]
name = "tanbaycu-chatbotsources"
version = "2.0.0"
description = "Collection of AI-powered Telegram bots for assistant workflows, PDF analysis, and video analysis with Gemini"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
