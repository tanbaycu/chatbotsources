bots:
  - changed-files:
      - any-glob-to-any-file: ["tanbaycu-*/**/*.py", "shared/**/*.py"]

tests:
  - changed-files:
      - any-glob-to-any-file: ["tests/**/*.py"]

documentation:
  - changed-files:
      - any-glob-to-any-file: ["**/*.md"]

configuration:
  - changed-files:
      - any-glob-to-any-file: [".github/**/*", "pyproject.toml", "**/requirements*.txt"]
